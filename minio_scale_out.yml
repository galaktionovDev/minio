- name: MinIO scale-out prechecks (fail-fast)
  hosts: "{{ minio_cluster_nodes_group | default('node') }}"
  become: true
  any_errors_fatal: true

  tasks:
    - name: Ensure HA mode
      ansible.builtin.assert:
        that:
          - minio_cluster_mode == 'High Availability'
        fail_msg: >
          Scale-out разрешён только в HA.

    - name: Compute new nodes count from inventory
      ansible.builtin.set_fact:
        minio_new_nodes_count: >-
          {{
            (groups[minio_cluster_nodes_group | default('node')] | default([]) | length)
            - (minio_node_count | default(0) | int)
          }}

    - name: Validate new nodes count is 2..4
      ansible.builtin.assert:
        that:
          - (minio_new_nodes_count | int) >= 2
          - (minio_new_nodes_count | int) <= 4
        fail_msg: >
          Добавлять можно только 2..4 узла за один проход.

- name: MinIO scale-out (add new server pool)
  hosts: "{{ minio_cluster_nodes_group | default('node') }}"
  become: true
  any_errors_fatal: true

  tasks:
    - name: Run role tasks for scale-out only
      ansible.builtin.import_role:
        name: .
        tasks_from: scale_out.yml

- name: MinIO LB reconfigure after scale-out
  hosts: "{{ minio_lb_group | default('lb') }}"
  become: true
  any_errors_fatal: true

  tasks:
    - name: Rebuild LB backends and nginx config after scale-out
      when:
        - minio_enable_lb | default(false) | bool
        - (groups[minio_lb_group | default('lb')] | default([])) | length > 0
      ansible.builtin.import_role:
        name: .
        tasks_from: minio_lb.yml
