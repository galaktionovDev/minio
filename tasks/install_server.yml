---
- name: Ensure minio group exists
  ansible.builtin.group:
    name: "{{ minio_group }}"
    system: true

- name: Ensure minio user exists
  ansible.builtin.user:
    name: "{{ minio_user }}"
    system: true
    shell: /usr/sbin/nologin

- name: Запомнить путь к пакету MinIO Server
  ansible.builtin.set_fact:
    _minio_server_deb_path: "{{ minio_installer_dir }}/minio-server.deb"

- name: Создать каталог для установочных файлов
  ansible.builtin.file:
    path: "{{ minio_installer_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Скачать пакет MinIO Server
  ansible.builtin.get_url:
    url: "{{ minio_server_deb_url }}"
    dest: "{{ _minio_server_deb_path }}"
    mode: "0644"
  register: _minio_server_download
  retries: 3
  delay: 3
  until: _minio_server_download is succeeded

- name: Установить пакет MinIO Server
  ansible.builtin.apt:
    deb: "{{ _minio_server_deb_path }}"
    state: present
  register: _minio_server_installed

- name: Создать каталоги конфигурации MinIO
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minio_user }}"
    group: "{{ minio_group }}"
    mode: "0750"
  loop:
    - "{{ minio_etc_dir }}"
    - "{{ minio_cert_dir }}"
    - "{{ minio_policy_dir }}"
