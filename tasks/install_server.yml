---
- name: Ensure minio group exists
  ansible.builtin.group:
    name: "{{ minio_group }}"
    system: true

- name: Ensure minio user exists
  ansible.builtin.user:
    name: "{{ minio_user }}"
    system: true
    shell: /usr/sbin/nologin

- name: Запомнить путь к пакету MinIO Server
  ansible.builtin.set_fact:
    _minio_server_pkg_path: "{{ minio_installer_dir }}/minio-server.{{ 'rpm' if (ansible_distribution.split(' ') | first | lower == 'red') else 'deb' }}"

- name: Создать каталог для установочных файлов
  ansible.builtin.file:
    path: "{{ minio_installer_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Скачать пакет MinIO Server
  ansible.builtin.get_url:
    url: "{{ minio_server_rpm_url if (ansible_distribution.split(' ') | first | lower == 'red') else minio_server_deb_url }}"
    dest: "{{ _minio_server_pkg_path }}"
    mode: "0644"
  register: _minio_server_download
  retries: 3
  delay: 3
  until: _minio_server_download is succeeded

- name: Установить пакет MinIO Server via apt (Debian/Ubuntu)
  ansible.builtin.apt:
    deb: "{{ _minio_server_pkg_path }}"
    state: present
  register: _minio_server_installed_deb
  when: ansible_os_family == 'Debian'

- name: Установить пакет MinIO Server via dnf (Red OS)
  ansible.builtin.dnf:
    name: "{{ _minio_server_pkg_path }}"
    state: present
    disable_gpg_check: true
  register: _minio_server_installed_rpm
  when: ansible_distribution.split(' ') | first | lower == 'red'

- name: Создать каталоги конфигурации MinIO
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minio_user }}"
    group: "{{ minio_group }}"
    mode: "0750"
  loop:
    - "{{ minio_etc_dir }}"
    - "{{ minio_cert_dir }}"
    - "{{ minio_policy_dir }}"
