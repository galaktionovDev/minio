- name: Собрать список узлов кластера
  run_once: true
  delegate_to: localhost
  ansible.builtin.set_fact:
    _hosts: "{{ groups[minio_cluster_nodes_group] | default(ansible_play_hosts_all) }}"
    _first_host: "{{ (groups[minio_cluster_nodes_group] | default(ansible_play_hosts_all)) | first }}"

- name: Инициализировать параметры балансировщика
  run_once: true
  delegate_to: localhost
  ansible.builtin.set_fact:
    _lb_hosts: []
    _lb_host: ''
    _lb_addr: ''

- name: Собрать список балансировщиков
  when:
    - minio_enable_lb | default(false)
    - (groups[minio_lb_group] | default([])) | length > 0
  run_once: true
  delegate_to: localhost
  vars:
    lb_hosts: "{{ groups[minio_lb_group] | default([]) }}"
    lb_host: "{{ (groups[minio_lb_group] | default([])) | first }}"
  ansible.builtin.set_fact:
    _lb_hosts: "{{ lb_hosts }}"
    _lb_host: "{{ lb_host }}"
    _lb_addr: >-
      {{
        hostvars[lb_host].ansible_host
        | default(hostvars[lb_host].ansible_default_ipv4.address)
        | default(lb_host)
      }}

- name: Определить параметры первого узла
  run_once: true
  delegate_to: localhost
  ansible.builtin.set_fact:
    _first_addr: >-
      {{
        hostvars[_first_host].ansible_host
        | default(hostvars[_first_host].ansible_default_ipv4.address)
        | default(_first_host)
      }}
    _scheme: "{{ minio_scheme | default('http') }}"
    _api_port: "{{ minio_server_port | default('9000') }}"
    _console_port: "{{ minio_console_port | default('9001') }}"
    _lb_api_domain: "{{ minio_lb_api_domain | default('') }}"
    _lb_console_domain: "{{ minio_lb_console_domain | default('') }}"
    _first_mounts: >-
      {{
        hostvars[_first_host].minio_extra_disks
        | default([])
        | map(attribute='mount')
        | list
      }}

- name: Вычислить итоговые параметры кластера
  run_once: true
  delegate_to: localhost
  ansible.builtin.set_fact:
    cluster_mode: >-
      {{
        'ha'
        if (
          (minio_cluster_mode_effective | default(minio_cluster_mode | default(''))) in [
            'ha', 'distributed', 'cluster', 'erasure', 'erasure-coded', 'high-availability'
          ]
          or ((_hosts | length) | int > 1)
        )
        else 'single'
      }}
    minio_node_count: "{{ (_hosts | length) | int }}"
    minio_drives_per_node: "{{ (_first_mounts | length) if (_first_mounts | length) else 1 }}"
    inventory_first_host: "{{ _first_host }}"
    connection_url: >-
      {%- set lb_enabled = minio_enable_lb | default(false) -%}
      {%- set lb_candidate = _lb_api_domain if (_lb_api_domain | length) > 0 else _lb_addr -%}
      {%- set host = lb_candidate if (lb_enabled and (lb_candidate | length) > 0) else _first_addr -%}
      {%- set scheme = _scheme -%}
      {%- set port = (minio_lb_api_port | default(_api_port)) if (lb_enabled and (lb_candidate | length) > 0) else _api_port -%}
      {%- if '://' in host -%}
        {%- set base = host -%}
        {%- set host_part = host.split('://', 1)[1] -%}
      {%- else -%}
        {%- set base = scheme ~ '://' ~ host -%}
        {%- set host_part = host -%}
      {%- endif -%}
      {%- if host_part | regex_search(':[0-9]+$') or ('/' in host_part) -%}
        {{ base }}
      {%- else -%}
        {{ base ~ ':' ~ port }}
      {%- endif -%}
    console_url: >-
      {%- set lb_enabled = minio_enable_lb | default(false) -%}
      {%- set console_candidate = (_lb_console_domain if (_lb_console_domain | length) > 0 else _lb_api_domain) -%}
      {%- set lb_candidate = console_candidate if (console_candidate | length) > 0 else _lb_addr -%}
      {%- set host = lb_candidate if (lb_enabled and (lb_candidate | length) > 0) else _first_addr -%}
      {%- set scheme = _scheme -%}
      {%- set port = (minio_lb_console_port | default(_console_port)) if (lb_enabled and (lb_candidate | length) > 0) else _console_port -%}
      {%- if '://' in host -%}
        {%- set base = host -%}
        {%- set host_part = host.split('://', 1)[1] -%}
      {%- else -%}
        {%- set base = scheme ~ '://' ~ host -%}
        {%- set host_part = host -%}
      {%- endif -%}
      {%- if host_part | regex_search(':[0-9]+$') or ('/' in host_part) -%}
        {{ base }}
      {%- else -%}
        {{ base ~ ':' ~ port }}
      {%- endif -%}

- name: Опубликовать данные для интерфейса
  run_once: true
  delegate_to: localhost
  ansible.builtin.set_stats:
    data:
      connection_url: "{{ connection_url }}"
      console_url: "{{ console_url }}"
      access_key: "{{ minio_root_user }}"
      cluster_mode: "{{ cluster_mode }}"
      minio_node_count: "{{ minio_node_count }}"
      minio_drives_per_node: "{{ minio_drives_per_node }}"
      inventory_first_host: "{{ inventory_first_host }}"
