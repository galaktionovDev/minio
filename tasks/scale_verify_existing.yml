---
- name: Выбрать каталоги данных существующего узла
  ansible.builtin.set_fact:
    minio_existing_mounts: >-
      {%- set mounts = [] -%}
      {%- for pool in minio_runtime_pools -%}
      {%- if inventory_hostname in pool['hosts'] -%}
      {%- for index in range(1, (pool['drives_per_node'] | int) + 1) -%}
      {%- set _ = mounts.append('/app/disk' ~ index) -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {{ mounts }}
  when: inventory_hostname in minio_existing_hosts

- name: Прочитать фактические монтирования существующего узла
  ansible.builtin.command:
    argv: [findmnt, -rn, -M, "{{ item }}", -o, 'TARGET,FSTYPE,OPTIONS,UUID']
  loop: "{{ minio_existing_mounts | default([]) }}"
  register: _minio_existing_mount_info
  changed_when: false
  when: inventory_hostname in minio_existing_hosts

- name: Проверить XFS и доступность существующих дисков для записи
  ansible.builtin.assert:
    that:
      - item.stdout.split() | length == 4
      - item.stdout.split()[0] == item.item
      - item.stdout.split()[1] == 'xfs'
      - "'rw' in item.stdout.split()[2].split(',')"
    fail_msg: "Существующий каталог {{ item.item }} не является смонтированной XFS с доступом для записи"
  loop: "{{ _minio_existing_mount_info.results | default([]) }}"
  when: inventory_hostname in minio_existing_hosts

- name: Проверить сохранённые UUID XFS существующих дисков
  ansible.builtin.assert:
    that:
      - _matching_mounts | length == 1
      - _matching_mounts[0].stdout.split()[3] == item.fs_uuid
    fail_msg: "UUID XFS {{ item.mount }} отличается от сохранённого"
  vars:
    _matching_mounts: "{{ _minio_existing_mount_info.results | selectattr('item', 'equalto', item.mount) | list }}"
  loop: "{{ minio_existing_storage_disks | default([]) }}"
  when:
    - inventory_hostname in minio_existing_hosts
    - item.fs_uuid is defined

- name: Прочитать версию нового сервера
  ansible.builtin.command:
    cmd: "{{ minio_bin_path }} --version"
  register: _minio_new_version
  changed_when: false
  when: inventory_hostname in minio_new_hosts

- name: Проверить совпадение версии нового и существующего сервера
  ansible.builtin.assert:
    that:
      - _minio_new_version.stdout_lines[0] == hostvars[minio_primary_host]._minio_existing_version.stdout_lines[0]
    fail_msg: "Версия нового сервера отличается от существующего кластера"
  when: inventory_hostname in minio_new_hosts
