---
- name: Собрать список блочных устройств в формате JSON
  # Флаг -J возвращает валидный JSON, который легко парсить без регулярных выражений
  ansible.builtin.command: lsblk -Jdn -o NAME,TYPE,MOUNTPOINT
  register: _minio_lsblk_json
  changed_when: false

- name: Сформировать перечень доступных дисков
  ansible.builtin.set_fact:
    _minio_all_disks: >-
      {{
        ( _minio_lsblk_json.stdout | from_json )['blockdevices']
        | selectattr('type', 'equalto', 'disk')
        | map(attribute='name')
        | map('regex_replace', '^', '/dev/')
        | list
      }}
  changed_when: false

- name: Автоматически определить и исключить системный диск
  ansible.builtin.set_fact:
    _sys_device: "{{ item.device | regex_replace('[0-9]+$', '') | regex_replace('p[0-9]+$', '') }}"
  loop: "{{ ansible_mounts }}"
  when: item.mount == '/'
  changed_when: false

- name: Исключить системные устройства хранения из обработки
  ansible.builtin.set_fact:
    minio_preconf_data_devices: >-
      {{
        _minio_all_disks
        | reject('equalto', _sys_device)
        | list
      }}
  changed_when: false

- name: Определить смонтированные каталоги MinIO
  ansible.builtin.set_fact:
    _minio_current_mounts: "{{ ansible_mounts | map(attribute='mount') | list }}"
    _minio_required_datadirs: "{{ minio_server_datadirs | default([]) }}"
  changed_when: false

- name: Выявить каталоги, требующие подготовки
  ansible.builtin.set_fact:
    _minio_datadirs_to_prepare: "{{ _minio_required_datadirs | difference(_minio_current_mounts) }}"
  changed_when: false

- name: Пропустить подготовку, если каталоги уже смонтированы
  ansible.builtin.set_fact:
    _minio_skip_disk_prepare: true
  when: _minio_datadirs_to_prepare | length == 0
  changed_when: false

- name: Проверить соответствие количества устройств
  ansible.builtin.assert:
    that:
      - minio_preconf_data_devices | length >= _minio_datadirs_to_prepare | length
    fail_msg: "Нужно устройств не меньше, чем несмонтированных каталогов: {{ _minio_datadirs_to_prepare }}"
  when: not (_minio_skip_disk_prepare | default(false))

- name: Сопоставить устройства и каталоги
  ansible.builtin.set_fact:
    _minio_device_mount_pairs: >-
      {%- set pairs = [] -%}
      {%- for idx in range(0, _minio_datadirs_to_prepare | length) -%}
        {%- set _ = pairs.append({'key': minio_preconf_data_devices[idx], 'value': _minio_datadirs_to_prepare[idx]}) -%}
      {%- endfor -%}
      {{ pairs }}
  when: not (_minio_skip_disk_prepare | default(false))
  changed_when: false

- name: Подготовить оставшиеся диски
  ansible.builtin.include_tasks: prepare_single_disk.yml
  loop: "{{ _minio_device_mount_pairs }}"
  when: not (_minio_skip_disk_prepare | default(false))

- name: Назначить владельца каталогов данных MinIO
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minio_user }}"
    group: "{{ minio_group }}"
    mode: "0750"
  loop: "{{ minio_server_datadirs | default([]) }}"
  when: (minio_server_datadirs | default([])) | length > 0
