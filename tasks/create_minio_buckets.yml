---
- name: Проверить параметры бакета
  ansible.builtin.assert:
    that:
      - bucket_name is defined
      - (bucket_name | string) | length > 0
      - (minio_root_user | default(access_key | default(''), true)) | length > 0
      - minio_root_password | default('') | length > 0
    fail_msg: "bucket_name and MinIO root credentials are required"

- name: Выбрать узел для работы с бакетами
  run_once: true
  ansible.builtin.set_fact:
    _mc_host: "{{ groups['nodes'] | first }}"
    _mc_alias: "{{ minio_alias | default('myminio') }}"
    _mc_connection: >-
      {{ (connection_url | urlsplit('scheme')) ~ '://' ~
         (minio_root_user | default(access_key | default(''), true)) ~ ':' ~
         minio_root_password ~ '@' ~ (connection_url | urlsplit('netloc')) }}
  no_log: true

- name: Найти исполняемый файл mc на целевом хосте
  run_once: true
  delegate_to: "{{ _mc_host }}"
  ansible.builtin.shell: |
    for b in /usr/local/bin/mcli /usr/bin/mcli /usr/local/bin/mc /usr/bin/mc; do
      [ -x "$b" ] && { echo "$b"; exit 0; }
    done
    exit 1
  register: _mc_bin_search
  changed_when: false
  failed_when: _mc_bin_search.rc != 0

- name: Bucket | Зафиксировать путь к бинарнику mc
  run_once: true
  ansible.builtin.set_fact:
    _mc_bin: "{{ _mc_bin_search.stdout | trim }}"

- name: Проверить учётные данные MinIO
  run_once: true
  delegate_to: "{{ _mc_host }}"
  ansible.builtin.command:
    argv:
      - "{{ _mc_bin }}"
      - ls
      - "{{ _mc_alias }}"
  environment: "{{ {'MC_HOST_' ~ _mc_alias: _mc_connection} }}"
  changed_when: false
  no_log: true

- name: Проверить, существует ли бакет
  run_once: true
  delegate_to: "{{ _mc_host }}"
  ansible.builtin.shell: |
    MC_CONFIG_DIR=/root/.mc "{{ _mc_bin }}" stat "{{ _mc_alias }}/{{ bucket_name }}"
  environment: "{{ {'MC_HOST_' ~ _mc_alias: _mc_connection} }}"
  no_log: true
  register: _stat
  changed_when: false
  failed_when: false

- name: Создать бакет при отсутствии
  run_once: true
  when: _stat.rc != 0
  delegate_to: "{{ _mc_host }}"
  ansible.builtin.shell: |
    MC_CONFIG_DIR=/root/.mc "{{ _mc_bin }}" mb --ignore-existing "{{ _mc_alias }}/{{ bucket_name }}"
  environment: "{{ {'MC_HOST_' ~ _mc_alias: _mc_connection} }}"
  no_log: true
  register: _mb
  changed_when: true

- name: Сформировать ссылку на бакет
  run_once: true
  become: false
  delegate_to: localhost
  ansible.builtin.set_fact:
    _bucket_url: "{{ connection_url | regex_replace('/+$','') ~ '/' ~ bucket_name }}"

- name: Опубликовать результат создания бакета
  run_once: true
  become: false
  delegate_to: localhost
  ansible.builtin.set_stats:
    data:
      bucket_name: "{{ bucket_name }}"
      bucket_url: "{{ _bucket_url }}"
      bucket_alias: "{{ _mc_alias }}"
      bucket_created: "{{ _stat.rc != 0 }}"
