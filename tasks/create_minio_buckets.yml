---
- name: Проверить параметры бакета
  ansible.builtin.assert:
    that:
      - bucket_name is defined
      - (bucket_name | string) | length > 0
    fail_msg: "bucket_name is required"

- name: Выбрать узел для работы с бакетами
  run_once: true
  ansible.builtin.set_fact:
    _mc_host: "{{ groups['nodes'] | first }}"
    _mc_alias: "{{ minio_alias | default('myminio') }}"
    _mc_config_dir: "/home/{{ ansible_user | default('cloud-config-mgmt') }}/.mc"

- name: Найти исполняемый файл mc на целевом хосте
  run_once: true
  delegate_to: "{{ _mc_host }}"
  become: false
  ansible.builtin.shell: |
    which mcli 2>/dev/null || which mc 2>/dev/null
  register: _mc_bin_search
  changed_when: false
  failed_when: _mc_bin_search.rc != 0

- name: Bucket | Зафиксировать путь к бинарнику mc
  run_once: true
  ansible.builtin.set_fact:
    _mc_bin: "{{ _mc_bin_search.stdout | trim }}"

- name: Актуализировать алиас mc конфигурации
  run_once: true
  become: false
  delegate_to: "{{ _mc_host }}"
  ansible.builtin.shell: |
    yes | "{{ _mc_bin }}" alias set "{{ _mc_alias }}" \
      "{{ connection_url | regex_replace('/+$','') }}" \
      "{{ minio_root_user }}" "{{ minio_root_password }}"
  environment:
    TERM: linux
    MC_CONFIG_DIR: "{{ _mc_config_dir }}"
  register: _alias_set
  changed_when: true

- name: Проверить, существует ли бакет
  run_once: true
  become: false
  delegate_to: "{{ _mc_host }}"
  ansible.builtin.shell: |
    "{{ _mc_bin }}" stat "{{ _mc_alias }}/{{ bucket_name }}" >/dev/null 2>&1
  environment:
    MC_CONFIG_DIR: "{{ _mc_config_dir }}"
  register: _stat
  changed_when: false
  failed_when: false

- name: Создать бакет при отсутствии
  run_once: true
  become: false
  when: _stat.rc != 0
  delegate_to: "{{ _mc_host }}"
  ansible.builtin.shell: |
    "{{ _mc_bin }}" mb --ignore-existing "{{ _mc_alias }}/{{ bucket_name }}"
  environment:
    MC_CONFIG_DIR: "{{ _mc_config_dir }}"
  register: _mb
  changed_when: true

- name: Сформировать ссылку на бакет
  run_once: true
  become: false
  delegate_to: localhost
  ansible.builtin.set_fact:
    _bucket_url: "{{ connection_url | regex_replace('/+$','') ~ '/' ~ bucket_name }}"

- name: Опубликовать результат создания бакета
  run_once: true
  become: false
  delegate_to: localhost
  ansible.builtin.set_stats:
    data:
      bucket_name: "{{ bucket_name }}"
      bucket_url: "{{ _bucket_url }}"
      bucket_alias: "{{ _mc_alias }}"
      bucket_created: "{{ _stat.rc != 0 }}"
