---
- name: Install nginx for MinIO load balancing
  ansible.builtin.include_tasks: minio_lb_install.yml

- name: Compile backend list for nginx
  ansible.builtin.include_tasks: minio_lb_build_backends.yml

- name: Write nginx configuration for MinIO
  ansible.builtin.include_tasks: minio_lb_configure.yml

- name: Apply pending handlers before leaving load balancer
  ansible.builtin.meta: flush_handlers
