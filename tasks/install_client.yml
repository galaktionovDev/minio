---
- name: Define MinIO client package path
  ansible.builtin.set_fact:
    _minio_client_deb_path: "{{ minio_installer_dir }}/minio-client.deb"

- name: Ensure MinIO installer directory exists
  ansible.builtin.file:
    path: "{{ minio_installer_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download the MinIO client package
  ansible.builtin.get_url:
    url: "{{ minio_client_deb_url }}"
    dest: "{{ _minio_client_deb_path }}"
    mode: "0644"
  become: true

- name: Install MinIO client package
  ansible.builtin.apt:
    deb: "{{ _minio_client_deb_path }}"
    state: present
  become: true

- name: Detect mcli path candidates
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/bin/mcli
    - /usr/bin/mcli
  register: _mcli_stats

- name: Pick existing mcli path
  ansible.builtin.set_fact:
    _mcli_path: >-
      {{
        (_mcli_stats.results
        | selectattr('stat.exists', 'defined')
        | selectattr('stat.exists')
        | map(attribute='stat.path')
        | list
        | first) | default('')
      }}

- name: Fail if mcli missing
  ansible.builtin.fail:
    msg: "mcli (mc) not found after installation"
  when: _mcli_path == ''

- name: Ensure mc compatibility symlink
  ansible.builtin.file:
    src: "{{ _mcli_path }}"
    dest: /usr/local/bin/mc
    state: link
    mode: "0755"
  become: true

- name: Ensure root mc config dir exists
  ansible.builtin.file:
    path: /root/.mc
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: MC | Build command
  ansible.builtin.set_fact:
    mc_command: "/usr/local/bin/mc{{ '' if minio_validate_certificate else ' --insecure' }} --config-dir /root/.mc"

- name: MC | Ensure minio_url
  ansible.builtin.set_fact:
    minio_url: "http://{{ ansible_default_ipv4.address | default(ansible_host) }}:{{ minio_server_port }}"
  when: (minio_url | default('')) == ''

- name: MC | Wait for MinIO to be up (best-effort)
  ansible.builtin.wait_for:
    host: "{{ ansible_default_ipv4.address | default(ansible_host) }}"
    port: "{{ minio_server_port | int }}"
    connect_timeout: 2
    timeout: 15
  register: _mc_wait
  failed_when: false
  become: true

- name: MC | Check existing alias
  ansible.builtin.command: >
    {{ mc_command }} alias ls {{ minio_alias }}
  register: _mc_alias_check
  failed_when: false
  changed_when: false
  become: true

- name: MC | Configure MinIO alias
  ansible.builtin.command: >
    {{ mc_command }} alias set {{ minio_alias }}
    {{ minio_url }} {{ minio_root_user }} {{ minio_root_password }}
  when:
    - (_mc_alias_check.rc | int) != 0
    - (_mc_wait is succeeded)
  register: _mc_alias_set
  failed_when: false
  changed_when: "'success' in (_mc_alias_set.stdout | lower | default(''))"
  become: true
