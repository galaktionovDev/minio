---
- name: Выбрать основной существующий узел
  ansible.builtin.set_fact:
    minio_primary_host: "{{ existing_nodes | map(attribute='hostname') | first }}"
  run_once: true

- name: Передать имя основного узла всем участникам
  ansible.builtin.set_fact:
    minio_primary_host: "{{ hostvars[ansible_play_hosts_all[0]].minio_primary_host }}"

- name: Собрать состав кластера
  ansible.builtin.set_fact:
    minio_all_hosts: "{{ groups[minio_cluster_nodes_group | default('node')] | list }}"
    minio_existing_hosts: "{{ existing_nodes | map(attribute='hostname') | list }}"
    minio_new_hosts: >-
      {{ groups[minio_cluster_nodes_group | default('node')]
         | difference(existing_nodes | map(attribute='hostname') | list) | sort | list }}
  when: inventory_hostname == minio_primary_host

- name: Прочитать действующую строку томов
  ansible.builtin.slurp:
    path: "{{ minio_server_envfile | default(minio_etc_dir ~ '/minio.conf') }}"
  register: _minio_current_env
  when: inventory_hostname == minio_primary_host
  no_log: true

- name: Получить действующую строку томов
  ansible.builtin.set_fact:
    minio_current_volumes: >-
      {%- set lines = (_minio_current_env.content | b64decode).splitlines() | map('trim') | list -%}
      {%- set line = lines | select('match', '^MINIO_VOLUMES=') | first | default('') -%}
      {%- set value = (line.split('=', 1)[1] | trim) if line else '' -%}
      {{ value[1:-1] if value[:1] in ['"', "'"] and value[-1:] == value[:1] else value }}
  when: inventory_hostname == minio_primary_host

- name: Проверить наличие строки томов перед дополнением
  ansible.builtin.assert:
    that:
      - hostvars[minio_primary_host].minio_current_volumes | length > 0
    fail_msg: "Не удалось прочитать MINIO_VOLUMES существующего кластера"
  run_once: true

- name: Прочитать действующие адреса псевдонимов
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "minio-{{ item }}"
  loop: "{{ range(1, (minio_existing_hosts | length) + 1) | list }}"
  register: _minio_alias_lookup
  changed_when: false
  when: inventory_hostname == minio_primary_host

- name: Сохранить адреса старых псевдонимов и добавить новые
  ansible.builtin.set_fact:
    minio_hosts_map: >-
      {%- set result = {} -%}
      {%- for lookup in _minio_alias_lookup.results -%}
      {%- set _ = result.update({'minio-' ~ lookup.item: lookup.stdout.split()[0]}) -%}
      {%- endfor -%}
      {%- for host in minio_new_hosts -%}
      {%- set _ = result.update({'minio-' ~ ((minio_existing_hosts | length) + loop.index): hostvars[host].ansible_host}) -%}
      {%- endfor -%}
      {{ result }}
    minio_volumes: >-
      {{ minio_current_volumes ~ ' '
         ~ (minio_server_scheme | default(minio_scheme | default('http'))) ~ '://minio-{'
         ~ ((minio_existing_hosts | length) + 1) ~ '...'
         ~ ((minio_existing_hosts | length) + (minio_new_hosts | length)) ~ '}:'
         ~ (minio_api_port | default(minio_server_port | default(9000)) | string)
         ~ '/app/disk{1...'
         ~ ((hostvars[minio_new_hosts[0]].storage_disks
              if hostvars[minio_new_hosts[0]].storage_disks is defined
              else hostvars[minio_new_hosts[0]].minio_extra_disks) | length) ~ '}' }}
  when: inventory_hostname == minio_primary_host

- name: Передать параметры конфигурации всем узлам
  ansible.builtin.set_fact:
    minio_all_hosts: "{{ hostvars[minio_primary_host].minio_all_hosts }}"
    minio_new_hosts: "{{ hostvars[minio_primary_host].minio_new_hosts }}"
    minio_hosts_map: "{{ hostvars[minio_primary_host].minio_hosts_map }}"
    minio_volumes: "{{ hostvars[minio_primary_host].minio_volumes }}"

- name: Собрать каталоги данных новых узлов
  ansible.builtin.set_fact:
    minio_server_datadirs: >-
      {{ (storage_disks if storage_disks is defined else minio_extra_disks) | map(attribute='mount') | list }}
  when: inventory_hostname in minio_new_hosts
  changed_when: false

- name: Создать группу для новых узлов
  ansible.builtin.group:
    name: "{{ minio_group }}"
    state: present
  when: inventory_hostname in minio_new_hosts

- name: Создать пользователя для новых узлов
  ansible.builtin.user:
    name: "{{ minio_user }}"
    group: "{{ minio_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  when: inventory_hostname in minio_new_hosts

- name: Подготовить диски новых узлов
  ansible.builtin.include_tasks: prepare_disks.yml
  when: inventory_hostname in minio_new_hosts

- name: Установить сервер на новых узлах
  ansible.builtin.include_tasks: install_server.yml
  when:
    - minio_install_server | bool
    - inventory_hostname in minio_new_hosts

- name: Обновить адреса узлов
  ansible.builtin.include_tasks: minio_hosts.yml

- name: Остановить службу перед дополнением конфигурации
  ansible.builtin.systemd:
    name: minio
    state: stopped

- name: Включить автоматический запуск
  ansible.builtin.set_fact:
    minio_autostart: true

- name: Применить конфигурацию на всех узлах
  ansible.builtin.include_tasks: configure_server.yml

- name: Применить отложенные обработчики
  ansible.builtin.meta: flush_handlers

- name: Установить и настроить клиент на новых узлах
  ansible.builtin.include_tasks: install_client.yml
  when:
    - minio_install_client | bool
    - inventory_hostname in minio_new_hosts

- name: Опубликовать сведения о дисках новых узлов
  ansible.builtin.include_tasks: storage_stats.yml
