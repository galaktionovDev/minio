---
- name: Выбрать основной существующий узел
  ansible.builtin.set_fact:
    minio_primary_host: "{{ (existing_nodes | map(attribute='hostname') | list | first) }}"
  run_once: true

- name: Передать имя основного узла всем участникам
  ansible.builtin.set_fact:
    minio_primary_host: "{{ hostvars[ansible_play_hosts_all[0]].minio_primary_host }}"

- name: Собрать состав кластера на основном узле
  ansible.builtin.set_fact:
    minio_all_hosts: "{{ groups[minio_cluster_nodes_group | default('node')] | list }}"
    minio_existing_hosts: "{{ existing_nodes | map(attribute='hostname') | list }}"
    minio_new_hosts: >-
      {{ groups[minio_cluster_nodes_group | default('node')]
         | difference(existing_nodes | map(attribute='hostname') | list)
         | list }}
  when: inventory_hostname == minio_primary_host

- name: Проверить существующие узлы до подготовки нового пула
  ansible.builtin.include_tasks: scale_preflight.yml

- name: Проверить контракт новых узлов
  ansible.builtin.assert:
    that:
      - hostvars[item].storage_disks is defined
      - hostvars[item].storage_item_id is defined
      - hostvars[item].storage_alias is defined
      - hostvars[item].storage_pool_id is defined
      - hostvars[item].storage_node_index is defined
      - (hostvars[item].storage_disks | length) > 0
    fail_msg: "Для нового узла {{ item }} отсутствует полный контракт хранения"
  loop: "{{ hostvars[minio_primary_host].minio_new_hosts }}"
  run_once: true

- name: Проверить одинаковое число дисков в новом пуле
  ansible.builtin.assert:
    that:
      - (hostvars[item].storage_disks | length) == (hostvars[hostvars[minio_primary_host].minio_new_hosts[0]].storage_disks | length)
    fail_msg: "Все узлы нового пула должны иметь одинаковое число дисков"
  loop: "{{ hostvars[minio_primary_host].minio_new_hosts }}"
  run_once: true

- name: Прочитать действующую конфигурацию кластера
  ansible.builtin.slurp:
    path: "{{ minio_server_envfile | default(minio_etc_dir ~ '/minio.conf') }}"
  register: _minio_current_env
  when: inventory_hostname == minio_primary_host
  no_log: true

- name: Получить действующую строку endpoints и индексы новых узлов
  ansible.builtin.set_fact:
    minio_current_volumes: >-
      {%- set content = (_minio_current_env.content | b64decode).splitlines() -%}
      {%- set line = content | select('match', '^MINIO_VOLUMES=') | list | first | default('') -%}
      {{ line | regex_replace('^MINIO_VOLUMES="(.*)"$', '\1') | regex_replace('^MINIO_VOLUMES=(.*)$', '\1') }}
    minio_new_node_indexes: >-
      {%- set indexes = [] -%}
      {%- for host in minio_new_hosts -%}
      {%-   set _ = indexes.append(hostvars[host].storage_node_index | int) -%}
      {%- endfor -%}
      {{ indexes }}
  when: inventory_hostname == minio_primary_host

- name: Сформировать endpoints только новых узлов
  ansible.builtin.set_fact:
    minio_new_pool_volumes: >-
      {{ (minio_scheme | default('http')) ~ '://minio-{'
         ~ (minio_new_node_indexes | min) ~ '...'
         ~ (minio_new_node_indexes | max) ~ '}:' ~ (minio_server_port | string)
         ~ '/app/disk{1...' ~ (hostvars[minio_new_hosts[0]].storage_disks | length) ~ '}' }}
  when: inventory_hostname == minio_primary_host

- name: Запретить изменение топологии без действующих endpoints
  ansible.builtin.assert:
    that:
      - hostvars[minio_primary_host].minio_current_volumes | length > 0
    fail_msg: "В действующей конфигурации отсутствует MINIO_VOLUMES"
  run_once: true

- name: Построить полную топологию и новый пул
  ansible.builtin.set_fact:
    minio_runtime_pools: >-
      {%- set base = [] -%}
      {%- if storage_pools is defined and (storage_pools | length) > 0 -%}
      {%-   for pool in storage_pools -%}
      {%-     set saved = {} -%}
      {%-     set _ = saved.update(pool) -%}
      {%-     if 'volumes' not in saved and 'host_range' in saved and 'drive_range' in saved -%}
      {%-       set volumes = (minio_scheme | default('http')) ~ '://minio-{' ~ saved['host_range'][0] ~ '...' ~ saved['host_range'][1] ~ '}:' ~ (minio_server_port | string) ~ '/app/disk{' ~ saved['drive_range'][0] ~ '...' ~ saved['drive_range'][1] ~ '}' -%}
      {%-       set _ = saved.update({'volumes': volumes}) -%}
      {%-     endif -%}
      {%-     set _ = base.append(saved) -%}
      {%-   endfor -%}
      {%- else -%}
      {%-   for pattern in minio_current_volumes.split() -%}
      {%-     if pattern != minio_new_pool_volumes -%}
      {%-     set host_ranges = pattern | regex_findall('minio-\{([0-9]+)\.\.\.([0-9]+)\}') -%}
      {%-     set drive_ranges = pattern | regex_findall('/app/disk\{([0-9]+)\.\.\.([0-9]+)\}') -%}
      {%-     set pool_hosts = [] -%}
      {%-     if host_ranges | length == 1 -%}
      {%-       for node in minio_observed_nodes -%}
      {%-         set index = node['alias'].split('-')[-1] | int -%}
      {%-         if index >= (host_ranges[0][0] | int) and index <= (host_ranges[0][1] | int) -%}
      {%-           set _ = pool_hosts.append(node['hostname']) -%}
      {%-         endif -%}
      {%-       endfor -%}
      {%-     endif -%}
      {%-     set drives = ((drive_ranges[0][1] | int) - (drive_ranges[0][0] | int) + 1) if drive_ranges | length == 1 else 0 -%}
      {%-     set _ = base.append({'id': 'pool-' ~ ((base | length) + 1), 'volumes': pattern,
              'hosts': pool_hosts, 'drives_per_node': drives}) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endif -%}
      {%- set new_hosts = minio_new_hosts -%}
      {%- set drives = hostvars[new_hosts[0]].storage_disks | length -%}
      {%- set pool_id = 'pool-' ~ ((base | length) + 1) -%}
      {%- set _ = base.append({'id': pool_id, 'volumes': minio_new_pool_volumes,
            'hosts': new_hosts, 'drives_per_node': drives}) -%}
      {{ base }}
    minio_new_pool_drives_per_node: "{{ hostvars[minio_new_hosts[0]].storage_disks | length }}"
  when: inventory_hostname == minio_primary_host

- name: Сформировать подтверждённый состав узлов по пулам
  ansible.builtin.set_fact:
    minio_storage_nodes: >-
      {%- set nodes = [] -%}
      {%- for node in minio_observed_nodes -%}
      {%-   set saved = {} -%}
      {%-   set _ = saved.update(node) -%}
      {%-   for pool in minio_runtime_pools -%}
      {%-     if node['hostname'] in pool['hosts'] -%}
      {%-       set _ = saved.update({'pool_id': pool['id']}) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%-   set _ = nodes.append(saved) -%}
      {%- endfor -%}
      {%- for host in minio_new_hosts -%}
      {%-   set _ = nodes.append({'item_id': hostvars[host].storage_item_id,
            'hostname': host, 'alias': hostvars[host].storage_alias,
            'pool_id': minio_runtime_pools[-1]['id']}) -%}
      {%- endfor -%}
      {{ nodes }}
  when: inventory_hostname == minio_primary_host

- name: Проверить сохранение действующих endpoints при новом запуске или продолжении
  ansible.builtin.assert:
    that:
      - _old_pools | length > 0
      - hostvars[minio_primary_host].minio_current_volumes in [_old_volumes, _full_volumes]
      - (_pool_hosts | sort) == (hostvars[minio_primary_host].minio_all_hosts | sort)
      - (_pool_hosts | unique | length) == (_pool_hosts | length)
      - (_pool_ids | unique | length) == (_pool_ids | length)
    fail_msg: "Существующая топология противоречит описанию пулов; изменение кластера остановлено"
  vars:
    _pools: "{{ hostvars[minio_primary_host].minio_runtime_pools }}"
    _old_pools: "{{ _pools[:-1] }}"
    _old_volumes: "{{ _old_pools | map(attribute='volumes') | join(' ') }}"
    _full_volumes: "{{ _pools | map(attribute='volumes') | join(' ') }}"
    _pool_hosts: "{{ _pools | map(attribute='hosts') | flatten }}"
    _pool_ids: "{{ _pools | map(attribute='id') | list }}"
  run_once: true

- name: Проверить описание каждого пула
  ansible.builtin.assert:
    that:
      - item.hosts | length > 0
      - item.drives_per_node | int > 0
    fail_msg: "Не удалось однозначно восстановить состав {{ item.id }}"
  loop: "{{ hostvars[minio_primary_host].minio_runtime_pools }}"
  run_once: true

- name: Проверить непрерывную нумерацию узлов нового пула
  ansible.builtin.assert:
    that:
      - (_new_indexes | max) - (_new_indexes | min) + 1 == (_new_indexes | length)
      - (_new_indexes | unique | length) == (_new_indexes | length)
    fail_msg: "Индексы узлов нового пула должны образовывать непрерывный диапазон"
  vars:
    _new_indexes: "{{ hostvars[minio_primary_host].minio_new_node_indexes }}"
  run_once: true

- name: Распространить топологию на все узлы
  ansible.builtin.set_fact:
    minio_all_hosts: "{{ hostvars[minio_primary_host].minio_all_hosts }}"
    minio_existing_hosts: "{{ hostvars[minio_primary_host].minio_existing_hosts }}"
    minio_new_hosts: "{{ hostvars[minio_primary_host].minio_new_hosts }}"
    minio_pools: "{{ hostvars[minio_primary_host].minio_runtime_pools }}"
    minio_runtime_pools: "{{ hostvars[minio_primary_host].minio_runtime_pools }}"
    minio_storage_nodes: "{{ hostvars[minio_primary_host].minio_storage_nodes }}"
    minio_effective_drives_per_node: >-
      {{ (storage_disks | length)
         if storage_disks is defined
         else (minio_drives_per_node | default(0) | int) }}

- name: Собрать каталоги данных новых узлов
  ansible.builtin.set_fact:
    minio_server_datadirs: "{{ storage_disks | map(attribute='mount') | list }}"
  when: inventory_hostname in minio_new_hosts
  changed_when: false

- name: Создать группу для новых узлов хранения
  ansible.builtin.group:
    name: "{{ minio_group }}"
    state: present
  when: inventory_hostname in minio_new_hosts

- name: Создать пользователя для новых узлов хранения
  ansible.builtin.user:
    name: "{{ minio_user }}"
    group: "{{ minio_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  when: inventory_hostname in minio_new_hosts

- name: Подготовить диски новых узлов
  ansible.builtin.include_tasks: prepare_disks.yml
  when: inventory_hostname in minio_new_hosts

- name: Установить сервер после подготовки дисков новых узлов
  ansible.builtin.include_tasks: install_server.yml
  when:
    - minio_install_server | bool
    - inventory_hostname in minio_new_hosts

- name: Проверить существующие монтирования и версии новых серверов
  ansible.builtin.include_tasks: scale_verify_existing.yml

- name: Обновить адреса узлов на всём кластере
  ansible.builtin.include_tasks: minio_hosts.yml

- name: Остановить службу перед изменением топологии
  ansible.builtin.systemd:
    name: minio
    state: stopped

- name: Включить автоматический запуск итоговой конфигурации
  ansible.builtin.set_fact:
    minio_autostart: true

- name: Применить полную топологию на всех узлах
  ansible.builtin.include_tasks: configure_server.yml

- name: Применить отложенные обработчики
  ansible.builtin.meta: flush_handlers

- name: Проверить готовность расширенного кластера
  ansible.builtin.include_tasks: wait_storage_ready.yml

- name: Установить и настроить клиент на новых узлах
  ansible.builtin.include_tasks: install_client.yml
  when:
    - minio_install_client | bool
    - inventory_hostname in minio_new_hosts

- name: Опубликовать результат масштабирования
  ansible.builtin.include_tasks: scale_storage_stats.yml
