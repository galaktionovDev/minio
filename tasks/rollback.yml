# tasks/rollback.yml

- name: Service | Stop and disable MinIO
  ansible.builtin.service:
    name: minio
    state: stopped
    enabled: false
  ignore_errors: true

- name: Service | Remove unit and env
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/minio.service
    - /etc/default/minio

- name: Service | Daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true

# Целевые точки монтирования
- name: Rollback | Resolve target mounts
  ansible.builtin.set_fact:
    _target_mounts: "{{ minio_server_datadirs
      | default(minio_extra_disks | map(attribute='mount') | list) }}"

- name: Rollback | Unmount data dirs (if mounted)
  ansible.posix.mount:
    path: "{{ item }}"
    state: unmounted
  loop: "{{ _target_mounts }}"
  ignore_errors: true

- name: Rollback | Remove fstab entries
  ansible.posix.mount:
    path: "{{ item }}"
    state: absent
  loop: "{{ _target_mounts }}"
  ignore_errors: true

# По умолчанию данные НЕ стираем. Включайте явно переменной minio_destroy_data=true
- name: Rollback | Discover devices by mountpoint
  ansible.builtin.command: "findmnt -no SOURCE --target {{ item }}"
  register: _mnt_src
  loop: "{{ _target_mounts }}"
  changed_when: false
  failed_when: false
  when: minio_destroy_data | default(false)

- name: Rollback | Unique device list
  ansible.builtin.set_fact:
    _rollback_devices: "{{ (_mnt_src.results
      | map(attribute='stdout') | select('length') | list) | unique }}"
  when: minio_destroy_data | default(false)

- name: Rollback | Wipe FS signatures (DANGER)
  ansible.builtin.command: "wipefs -fa {{ item }}"
  loop: "{{ _rollback_devices }}"
  when: minio_destroy_data | default(false)

- name: Rollback | Remove data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ _target_mounts }}"
  ignore_errors: true

- name: Binaries | Remove server and client
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ minio_server_bin | default('/usr/local/bin/minio') }}"
    - /usr/local/bin/mc
    - /usr/local/bin/mcli

- name: Client | Remove local mc config (root)
  ansible.builtin.file:
    path: /root/.mc
    state: absent
  ignore_errors: true

- name: User | Remove 'minio' user and group (opt-in)
  ansible.builtin.user:
    name: "{{ minio_user | default('minio') }}"
    state: absent
    remove: true
  when: minio_remove_user | default(false)
