---
# Строим адреса узлов и MINIO_VOLUMES для HA

- name: Collect cluster hosts
  ansible.builtin.set_fact:
    _cluster_hosts: "{{ groups['minio_cluster'] | default(ansible_play_hosts_all) }}"

- name: Build address list with fallbacks
  ansible.builtin.set_fact:
    _addr_list: >-
      {{ (_addr_list | default([])) + [
          (hostvars[item].ansible_host
            | default(hostvars[item].ansible_default_ipv4.address
            | default(item)))
        ] }}
  loop: "{{ _cluster_hosts }}"

- name: Ensure datadirs are present
  ansible.builtin.assert:
    that:
      - minio_server_datadirs is defined
      - minio_server_datadirs | length > 0
    fail_msg: "minio_server_datadirs не задан"

- name: Build MINIO_VOLUMES cartesian list
  ansible.builtin.set_fact:
    _vol_list: "{{ (_vol_list | default([])) + [ 'http://' ~ item.0 ~ ':' ~ _port ~ item.1 ] }}"
  loop: "{{ query('cartesian', _addr_list, minio_server_datadirs) }}"
  vars:
    _port: "{{ minio_config.minio_server_port | default(minio_server_port | default(9000)) }}"

- name: Join MINIO_VOLUMES into string
  ansible.builtin.set_fact:
    minio_volumes_ha: "{{ _vol_list | join(' ') }}"

- name: Build per-host S3 endpoints (optional)
  ansible.builtin.set_fact:
    minio_s3_endpoints: "{{ _addr_list | map('regex_replace', '^(.*)$', 'http://\\1:' ~ (minio_config.minio_server_port | default(minio_server_port | default(9000)))) | list }}"

- name: Build per-host Console endpoints (optional)
  ansible.builtin.set_fact:
    minio_console_endpoints: "{{ _addr_list | map('regex_replace', '^(.*)$', 'http://\\1:' ~ (minio_config.minio_console_port | default(minio_console_port | default(9001)))) | list }}"
