---
- name: Построить карту адресов при первоначальном создании
  ansible.builtin.set_fact:
    minio_hosts_map: >-
      {%- set result = {} -%}
      {%- for host in groups[minio_cluster_nodes_group | default('node')] -%}
      {%- set address = hostvars[host].minio_node_ip
              | default(hostvars[host].ansible_host)
              | default(hostvars[host].ansible_default_ipv4.address)
              | default(host) -%}
      {%- set _ = result.update({'minio-' ~ loop.index: address}) -%}
      {%- endfor -%}
      {{ result }}
  when: minio_hosts_map is not defined
  run_once: true

- name: Передать карту адресов всем узлам
  ansible.builtin.set_fact:
    minio_hosts_map: "{{ hostvars[ansible_play_hosts_all[0]].minio_hosts_map }}"

- name: Записать адреса узлов в hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    create: true
    regexp: '^[0-9.]+\s+{{ item.key }}$'
    line: "{{ item.value }} {{ item.key }}"
  loop: "{{ minio_hosts_map | dict2items }}"
  become: true
