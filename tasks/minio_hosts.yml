---
- name: Построить карту адресов узлов
  ansible.builtin.set_fact:
    minio_hosts_map: >-
      {%- set result = {} -%}
      {%- set hosts = minio_all_hosts | default(groups[minio_cluster_nodes_group | default('node')] | sort) -%}
      {%- for host in hosts -%}
      {%-   set alias = hostvars[host].storage_alias if hostvars[host].storage_alias is defined else 'minio-' ~ loop.index -%}
      {%-   set address = hostvars[host].minio_node_ip
              | default(hostvars[host].ansible_host)
              | default(hostvars[host].ansible_default_ipv4.address)
              | default(host) -%}
      {%-   set _ = result.update({alias: address}) -%}
      {%- endfor -%}
      {{ result }}
  run_once: true

- name: Передать карту адресов всем узлам
  ansible.builtin.set_fact:
    minio_hosts_map: "{{ hostvars[ansible_play_hosts_all[0]].minio_hosts_map }}"

- name: Записать адреса узлов в hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    create: true
    regexp: '^[0-9.]+\s+{{ item.key }}$'
    line: "{{ item.value }} {{ item.key }}"
  loop: "{{ minio_hosts_map | dict2items }}"
  become: true
