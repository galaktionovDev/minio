---
- name: Create MinIO configuration directory
  ansible.builtin.file:
    path: "{{ minio_etc_dir }}"
    state: directory
    owner: "{{ minio_user }}"
    group: "{{ minio_group }}"
    mode: "0750"

- name: Validate cluster mode settings
  ansible.builtin.assert:
    that:
      - minio_cluster_mode in ['Single Instance', 'High Availability']
      - (minio_cluster_mode == 'Single Instance') or ((minio_cluster_mode == 'High Availability') and (groups['minio_cluster'] | length) >= 1)
    fail_msg: "Некорректные параметры кластера MinIO"

- name: Render MinIO environment file
  template:
    src: minio.env.j2
    dest: "{{ minio_server_envfile }}"
    owner: "{{ minio_user }}"
    group: "{{ minio_group }}"
    mode: "0640"
  notify: Restart minio

- name: Deploy MinIO systemd unit
  ansible.builtin.template:
    src: minio.service.j2
    dest: /etc/systemd/system/minio.service
    owner: root
    group: root
    mode: "0644"

- name: Enable and start MinIO service
  ansible.builtin.systemd:
    name: minio
    state: started
    enabled: true
    daemon_reload: true
