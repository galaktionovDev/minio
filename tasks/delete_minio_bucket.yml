---
- name: Проверить параметры бакета
  ansible.builtin.assert:
    that:
      - bucket_name is defined
      - (bucket_name | string) | length > 0
    fail_msg: "bucket_name is required"

- name: Выбрать узел для работы с бакетами
  run_once: true
  ansible.builtin.set_fact:
    _mc_host: "{{ groups['nodes'] | first }}"
    _mc_alias: "{{ minio_alias | default('myminio') }}"

- name: Найти исполняемый файл mc на целевом хосте
  run_once: true
  become: true
  delegate_to: "{{ _mc_host }}"
  ansible.builtin.shell: |
    for b in /usr/local/bin/mc /usr/bin/mc /usr/local/bin/mcli /usr/bin/mcli; do
      [ -x "$b" ] && { echo "$b"; exit 0; }
    done
    exit 1
  register: _mc_bin
  changed_when: false

- name: Проверить, существует ли бакет
  run_once: true
  become: true
  delegate_to: "{{ _mc_host }}"
  ansible.builtin.shell: |
    MC_CONFIG_DIR=/root/.mc "{{ _mc_bin.stdout }}" stat "{{ _mc_alias }}/{{ bucket_name }}"
  register: _stat
  changed_when: false
  failed_when: false

- name: Удалить бакет при наличии
  run_once: true
  when: _stat.rc == 0
  become: true
  delegate_to: "{{ _mc_host }}"
  ansible.builtin.shell: |
    MC_CONFIG_DIR=/root/.mc "{{ _mc_bin.stdout }}" rb --force "{{ _mc_alias }}/{{ bucket_name }}"
  register: _rm
  changed_when: _rm.rc == 0

- name: Опубликовать результат удаления бакета
  run_once: true
  delegate_to: localhost
  ansible.builtin.set_stats:
    data:
      bucket_name: "{{ bucket_name }}"
