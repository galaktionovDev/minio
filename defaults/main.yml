---
minio_install_server: true
minio_install_client: true
minio_autostart: true

minio_group: minio
minio_user: minio

minio_server_datadirs: []

minio_server_cluster_nodes: []

# "Single Instance" | "High Availability"
minio_cluster_mode: "Single Instance"

minio_scheme: "http"

minio_etc_dir: /etc/minio
minio_cert_dir: "{{ minio_etc_dir }}/ssl"
minio_policy_dir: "{{ minio_etc_dir }}/policy"

minio_server_envfile: "{{ minio_etc_dir }}/minio.conf"

minio_bin_path: "{{ '/usr/bin/env minio' if (ansible_distribution.split(' ') | first | lower == 'red') else '/usr/local/bin/minio' }}"
minio_server_port: "9000"
minio_console_port: "9001"

minio_server_env_extra: ""
minio_site_region: "us-east-1"
minio_server_opts: ""

minio_url: ""
minio_root_user: ""
minio_root_password: ""

minio_enable_tls: false
minio_validate_certificate: false

minio_alias: "myminio"

minio_installer_dir: "/opt/minio/install"

minio_server_deb_url: "{{ nexus_url }}/repository/products-raw/minio/minio_20250907161309.0.0_amd64.deb"
minio_client_deb_url: "{{ nexus_url }}/repository/products-raw/minio/mcli_20250813083541.0.0_amd64.deb"
minio_server_rpm_url: "{{ nexus_url }}/repository/products-yum/el9/minio-20250907161309.0.0-1.x86_64.rpm"
minio_client_rpm_url: "{{ nexus_url }}/repository/products-yum/el9/mcli-20250813083541.0.0-1.x86_64.rpm"
minio_lb_group: "lb"
minio_cluster_nodes_group: "node"

minio_enable_lb: false
minio_lb_api_listen: "0.0.0.0:9000"
minio_lb_console_listen: "0.0.0.0:9001"
minio_lb_backends: []
minio_lb_api_port: "9000"
minio_lb_console_port: "9001"
minio_lb_api_domain: ""
minio_lb_console_domain: ""
minio_lb_nginx_conf: /etc/nginx/conf.d/minio.conf

minio_enforce_stripe_match: true
minio_rebalance_after_scale: false

node_exporter_path: "/app/node_exporter"
node_exporter_version: "1.7.0"
node_exporter_name: "node_exporter-{{ node_exporter_version }}.linux-amd64"
