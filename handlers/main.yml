---
- name: Перечитать unit MinIO
  ansible.builtin.systemd:
    name: minio
    daemon_reload: true

- name: Перезапустить службу MinIO
  ansible.builtin.service:
    name: minio
    state: restarted

- name: Перезапустить службу nginx
  ansible.builtin.service:
    name: nginx
    state: restarted
